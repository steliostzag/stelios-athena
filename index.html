<head>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 45%,rgba(23,73,77,.18),transparent 38%),linear-gradient(135deg,#071522 0%,#0a2030 48%,#07191d 100%);color:#d9e7e7;font-family:"Courier New",Courier,monospace}.scanlines{position:fixed;inset:0;pointer-events:none;opacity:.07;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,#b9ffff 4px)}.terminal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,92vw);height:min(620px,82vh);border:1px solid rgba(112,180,183,.38);background:rgba(3,13,22,.92);box-shadow:0 0 60px rgba(0,100,105,.16),inset 0 0 50px rgba(0,70,75,.08);border-radius:10px;overflow:hidden}.bar{height:38px;padding:0 14px;display:flex;align-items:center;gap:7px;background:rgba(20,43,54,.9);border-bottom:1px solid rgba(112,180,183,.2);color:#789497;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#4d686c}.title{margin-left:8px;letter-spacing:1px;opacity:.8}.screen{height:calc(100% - 38px);padding:30px 34px;overflow:auto}.line{margin:0 0 9px;white-space:pre-wrap;line-height:1.55}.dim{color:#658488}.prompt{color:#6fd0c8}.text{color:#d7e7e6}.heart{color:#e87872}.cursor{display:inline-block;width:9px;height:1.05em;background:#9dd9d4;vertical-align:-.18em;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.footer{position:absolute;bottom:15px;right:20px;color:#45676b;font-size:10px;letter-spacing:1px}@media(max-width:600px){.screen{padding:22px 18px}.line{font-size:13px}.terminal{height:84vh}}

<body><div class="terminal"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title">memory://stelios-athena</span></div><div class="screen" id="screen"></div><div class="footer">MEMORY VERIFIED</div></div><div class="scanlines"></div>
<script>
const lines=[
['> initializing memory...','dim',34],['> location verified.','dim',34],['> connection established.','dim',34],['','text',0],['$ ./anniversary.sh','prompt',65],['','text',0],['Stelios and Athena shared their first kiss','text',28],['at this very spot.','text',28],['','text',0],['Stelios was very happy that day.','text',28],['','text',0],['Since then, Stelios has been happy every day.','text',28],['','text',0],['Stelios loves Athena very much.','text',28],['','text',0],['He wishes for them to be together forever.','text',28],['','text',0],['Stelios wishes them a happy anniversary.','text',28],['','text',0],['> memory saved.','dim',38],['> process completed.','dim',38]];
const screen=document.getElementById('screen');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function typeLine([t,c,s]){const p=document.createElement('div');p.className='line '+c;screen.appendChild(p);if(!t){await sleep(220);return}for(const ch of t){p.textContent+=ch;screen.scrollTop=screen.scrollHeight;await sleep(s)}if(t.startsWith('Stelios wishes')){const h=document.createElement('span');h.className='heart';h.textContent=' ♥';p.appendChild(h)}await sleep(260)}

</script></body></html>
